<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | Bolsa de Pasantías</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="cabecera"></header>

  <main class="contenedor">
    <section class="tarjeta formulario-centrado" aria-labelledby="titulo">
      <h1 id="titulo">Crear cuenta</h1>

      <form id="form-registro" class="formulario" novalidate>
        <fieldset class="campo">
          <legend>Me registro como</legend>
          <div class="selector-rol">
            <label><input type="radio" name="rol" value="estudiante" checked> Estudiante</label>
            <label><input type="radio" name="rol" value="empresa"> Empresa</label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="nombre" id="etiqueta-nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
        </div>

        <!-- Datos solo de estudiante -->
        <div id="datos-estudiante" class="fila-2">
          <div class="campo">
            <label for="carrera">Carrera</label>
            <select id="carrera" name="carrera" required></select>
          </div>
          <div class="campo">
            <label for="semestre">Semestre</label>
            <select id="semestre" name="semestre" required></select>
          </div>
        </div>

        <!-- Datos solo de empresa -->
        <div id="datos-empresa" hidden>
          <div class="fila-2">
            <div class="campo">
              <label for="nit">NIT</label>
              <input type="text" id="nit" name="nit" inputmode="numeric" required>
            </div>
            <div class="campo">
              <label for="rubro">Rubro</label>
              <input type="text" id="rubro" name="rubro" placeholder="Ej.: Tecnología, Comercio" required>
            </div>
          </div>
          <div class="campo">
            <label for="descripcion">Descripción de la empresa</label>
            <textarea id="descripcion" name="descripcion" rows="3"></textarea>
          </div>
          <p class="mensaje mensaje--info">Tu cuenta quedará pendiente hasta que el administrador la apruebe. Recién entonces podrás publicar ofertas.</p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="whatsapp">Número de WhatsApp</label>
          <input type="tel" id="whatsapp" name="whatsapp" inputmode="numeric" pattern="591[67][0-9]{7}" placeholder="59170000000" required>
          <small>Con código de país, sin espacios ni signo +. Ej.: 59170000000</small>
        </div>

        <div class="fila-2">
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="campo">
            <label for="password2">Repetir contraseña</label>
            <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="6" required>
          </div>
        </div>

        <p id="mensaje" role="alert" hidden></p>

        <button type="submit" class="boton">Crear cuenta</button>
      </form>

      <p>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </section>
  </main>

  <script type="module" src="/js/paginas/registro.js"></script>
</body>
</html>
