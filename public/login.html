<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | CampusJob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="cabecera"></header>

  <main class="acceso">
    <aside class="acceso__lema">
      <p>Revisa tus postulaciones y responde a las empresas.</p>
      <small>Las empresas que publican en CampusJob fueron revisadas antes de poder publicar.</small>
    </aside>

    <section class="acceso__formulario" aria-labelledby="titulo">
      <div>
        <h1 id="titulo">Iniciar sesión</h1>

        <form id="form-login" class="formulario" novalidate>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" autocomplete="email" required>
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>

          <p id="mensaje" role="alert" hidden></p>

          <button type="submit" class="boton boton--bloque">Iniciar sesión</button>
          <button type="button" id="boton-recuperar" class="boton-limpiar">Olvidé mi contraseña</button>
        </form>

        <p class="pie-formulario">¿Todavía no tienes cuenta? <a href="/registro.html">Crear cuenta</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/paginas/login.js"></script>
</body>
</html>
