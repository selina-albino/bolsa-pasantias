<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Bolsa de Pasantías</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="cabecera"></header>

  <main class="contenedor">
    <section class="tarjeta formulario-centrado" aria-labelledby="titulo">
      <h1 id="titulo">Iniciar sesión</h1>

      <form id="form-login" class="formulario" novalidate>
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <p id="mensaje" role="alert" hidden></p>

        <button type="submit" class="boton">Ingresar</button>
        <button type="button" id="boton-recuperar" class="boton boton--secundario">¿Olvidaste tu contraseña?</button>
      </form>

      <p>¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
    </section>
  </main>

  <script type="module" src="/js/paginas/login.js"></script>
</body>
</html>
