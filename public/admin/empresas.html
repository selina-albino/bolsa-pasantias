<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validar empresas | CampusJob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="cabecera"></header>

  <main class="contenedor">
    <div class="encabezado-pagina">
      <div>
        <h1>Validar empresas</h1>
        <p id="subtitulo">Cargando empresas…</p>
      </div>
    </div>

    <fieldset class="filtros-validacion">
      <legend class="sr-only">Mostrar empresas</legend>
      <div id="filtros" class="opciones"></div>
    </fieldset>

    <p id="mensaje" role="alert" hidden></p>

    <ul id="lista-empresas" class="lista-ofertas" aria-label="Empresas registradas"></ul>
  </main>

  <script type="module" src="/js/paginas/admin-empresas.js"></script>
</body>
</html>
